# ─── Préfixe ──────────────────────────────────────────────────
# Ctrl+b est le défaut mais Ctrl+a est plus accessible (même main)
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # envoyer Ctrl+a au shell si on le tape deux fois

# ─── Comportement général ─────────────────────────────────────
set -g mouse on                     # Scroll souris, clic pour changer de pane, redimensionner
set -g default-terminal "screen-256color"
set -sg escape-time 0               # IMPORTANT : sans ça, nvim a un délai de 300ms sur Escape — doit être 0

# ─── Mode copie vim ───────────────────────────────────────────
setw -g mode-keys vi                                           # Navigation vim dans le mode copie
bind-key -T copy-mode-vi v send-keys -X begin-selection        # v → commencer la sélection (comme en mode visuel nvim)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel  # y → copier et quitter le mode copie

# ─── Barre de statut ──────────────────────────────────────────
# Couleurs Tokyo Night : bg=#1a1b26 (fond) fg=#a9b1d6 (texte)
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #S #[default] │ "  # Affiche le nom de la session en bleu
set -g status-right "#[fg=#9ece6a] %H:%M #[fg=#565f89]│ #[fg=#7dcfff]%d %b %Y #[default]"  # Heure et date
