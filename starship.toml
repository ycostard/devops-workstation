add_newline = false

format = """
$kubernetes\
$directory\
$git_branch\
$character"""

[kubernetes]
disabled = false
symbol = ""
format = '[$context \($namespace\)]($style) '
style = "bold cyan"


[directory]
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""

[character]
success_symbol = "[→](bold green)"
error_symbol = "[→](bold red)"
vimcmd_symbol = "[←](bold green)"
